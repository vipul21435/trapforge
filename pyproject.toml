[project]
name = "trapforge"
version = "0.1.0"
description = "Author verifiable, adversarial data tasks for AI agents: hidden-structure corpora, uniqueness proofs, reference solvers and byte-exact graders."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
]

[project.scripts]
trapforge = "trapforge.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "sympy>=1.13",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trapforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "PL",       # pylint subset
    "N",        # naming
]
ignore = [
    "PLR0913",  # math kernels legitimately take many arguments
    "PLR2004",  # small integer literals are the whole point of this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "N802", "N803", "N806"]
# Matrix names such as A, H, U follow standard linear-algebra notation.
"src/trapforge/linalg/**" = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: tests that build bundles or spawn subprocesses",
    "docker: tests that need a running Docker daemon",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["trapforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 85
